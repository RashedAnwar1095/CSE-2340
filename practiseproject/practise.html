<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSpace - Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Roboto Serif Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&display=swap" rel="stylesheet">
    <!-- Icons link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-user-graduate"></i>
            <p>Eduspace</p>
        </div>

        <nav aria-label="Main-Navigation">
            <a href="#" class="active">DashBoard</a>
            <a href="#">My Courses</a>
            <a href="#">Assignments</a>
            <a href="#">Results</a>
            <a href="#">Calender</a>
            <a href="#">Settings</a>
            <a href="#">Logout</a>
        </nav>
    </aside>

    <main>
        <header class="topbar">
            <div>
                <p>Student Dashboard</p>
                <h1>Good Morning, Ovi</h1>
            </div>

            <div class="user-profile">
                <div class="user-icon">O</div> 
                <div>
                    <strong>Ovi</strong>
                    <p>CSE Student</p>
                </div>
            </div>
        </header>

        <section class="stats">
            <div class="stat-card">
                <p class="stat-label">Enrolled Courses</p>
                <strong class="stat-number">06</strong>
                <p class="stat-info">This semester</p>
            </div>

            <div class="stat-card">
                <p class="stat-label">Average Progress</p>
                <strong class="stat-number">78%</strong>
                <p class="stat-info">+8% this month</p>
            </div>

            <div class="stat-card">
                <p class="stat-label">Pending Tasks</p>
                <strong class="stat-number">03</strong>
                <p class="stat-info">Need attention</p>
            </div>
        </section>
    </main>
</body>
</html>
