<!DOCTYPE html>
<html lang="en" class="box-border m-0 p-0">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Explorer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#12141c] text-[#e8e8ee] font-[Arial, Helvetica, sans-serif] leading-1.5">
    <header>
        <nav class="flex justify-between items-center py-3.75 px-7.5 bg-[#1b1e2b border-b-2 border-solid border-[#6c5ce7]]">
            <h1 class="text-[24px] text-[#a29bfe]">Game Explorer</h1>

            <div>
                <button class="bg-none border-0 text-[#e8e8ee] text-[16px] py-2 px-3.5 cursor-pointer rounded-md
                               hover:bg-[#2a2e40] active:bg-[#6c5ce7]">Browse</button>
                
                <button class="bg-none border-0 text-[#e8e8ee] text-[16px] py-2 px-3.5 cursor-pointer rounded-md
                               hover:bg-[#2a2e40] active:bg-[#6c5ce7]">Favourites</button>
            </div>
        </nav>
    </header>
</body>
</html>
