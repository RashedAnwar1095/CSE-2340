<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Student Performance Calculator</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen">
  <main class="max-w-2xl mx-auto p-4 sm:p-8 space-y-6">

    <header>
      <h1 class="text-2xl sm:text-3xl font-bold">Student Performance Calculator</h1>
      <p class="text-slate-600 dark:text-slate-400 mt-1">
        Enter three marks per student. Allowed range: <span id="rangeText" class="font-semibold"></span>.
      </p>
    </header>

    <!-- Input form -->
    <section class="bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 p-4 sm:p-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="sm:col-span-2">
          <label for="name" class="block text-sm font-medium mb-1">Student name</label>
          <input id="name" type="text" class="w-full rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-3 py-2">
        </div>
        <div>
          <label for="m1" class="block text-sm font-medium mb-1">Math</label>
          <input id="m1" type="text" inputmode="decimal" class="mark w-full rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-3 py-2">
        </div>
        <div>
          <label for="m2" class="block text-sm font-medium mb-1">Science</label>
          <input id="m2" type="text" inputmode="decimal" class="mark w-full rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-3 py-2">
        </div>
        <div>
          <label for="m3" class="block text-sm font-medium mb-1">English</label>
          <input id="m3" type="text" inputmode="decimal" class="mark w-full rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-3 py-2">
        </div>
      </div>

      <!-- Validation errors appear here -->
      <ul id="errors" class="mt-4 text-sm text-red-600 dark:text-red-400 list-disc list-inside space-y-1"></ul>

      <div class="mt-4 flex flex-wrap gap-3">
        <button id="addBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium rounded px-4 py-2">Add student</button>
        <button id="sampleBtn" class="border border-slate-300 dark:border-slate-600 rounded px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-700">Load 3 sample students</button>
        <button id="clearBtn" class="border border-slate-300 dark:border-slate-600 rounded px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-700">Clear list</button>
      </div>
    </section>

    <!-- Results -->
    <section class="bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 p-4 sm:p-6">
      <h2 class="text-lg font-semibold mb-3">Results</h2>
      <div id="results"></div>
    </section>

  </main>

    <script src="script.js"></script>
</body>
</html>
