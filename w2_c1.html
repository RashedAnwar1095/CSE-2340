<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar And Table</title>
</head>
<body>
    <header>
        <h1>Navigation and Table example</h1>
        <nav>
            <ul>
                <li><a href="#table">Table</a></li>
                <li><a href="#form">Form</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="table">
            <h2>Table</h2>
            <table border="1" style="border-collapse: collapse;">
                <caption>Example Table</caption>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>ID</th>
                        <th>GPA</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>BongoBhondu</td>
                        <td>C238749</td>
                        <td>1.99</td>
                    </tr>
                    <tr>
                        <td>Tarek Rahman</td>
                        <td>C2485962</td>
                        <td>2.19</td>
                    </tr>
                    <tr>
                        <td>George Bush</td>
                        <td>C000911</td>
                        <td>3.00</td>
                    </tr>
                </tbody>
            </table>
        </section>
        <section id="form">
            <h2>Form</h2>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br><br>
                <input type="submit" value="Submit">
            </form>
        </section>
    </main>
</body>
</html>
